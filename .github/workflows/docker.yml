name: Build robot image

# The image only holds dependencies, so rebuild only when they change.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - constraints.txt
      - robot/requirements.txt
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Native arm64 runner: same architecture as the Pi, no QEMU emulation
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/superstrika/superstrika-new:latest
            ghcr.io/superstrika/superstrika-new:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
